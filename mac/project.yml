name: LinkToMac
options:
  bundleIdPrefix: de.linktomac
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_LANGUAGE: de
targets:
  LinkToMac:
    type: application
    platform: macOS
    sources:
      - path: LinkToMac
    info:
      path: LinkToMac/Info.plist
      properties:
        CFBundleDisplayName: Link to Mac
        CFBundleName: Link to Mac
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: de
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "13.0"
        NSLocalNetworkUsageDescription: "Link to Mac verbindet sich über dein lokales WLAN mit deinem Android-Handy."
        NSBonjourServices:
          - _linktomac._tcp
        NSHumanReadableCopyright: "Link to Mac – privates Open-Source-Projekt"
    entitlements:
      path: LinkToMac/LinkToMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linktomac.mac
        PRODUCT_NAME: LinkToMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  LinkToMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LinkToMacTests
    dependencies:
      - target: LinkToMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linktomac.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LinkToMac.app/Contents/MacOS/LinkToMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
schemes:
  LinkToMac:
    build:
      targets:
        LinkToMac: all
        LinkToMacTests: [test]
    test:
      targets:
        - LinkToMacTests
