name: Build Mac App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: mac
        run: xcodegen generate
      - name: Build
        working-directory: mac
        run: |
          set -o pipefail
          xcodebuild -project LinkToMac.xcodeproj -scheme LinkToMac \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO build | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Start fake phone for end-to-end test
        run: |
          # Uses the openssl CLI (no pip packages needed).
          nohup python3 tools/fake_phone.py > fake_phone.log 2>&1 < /dev/null &
          sleep 3
          cat fake_phone.log
      - name: Unit + end-to-end tests
        working-directory: mac
        run: |
          set -o pipefail
          xcodebuild -project LinkToMac.xcodeproj -scheme LinkToMac \
            -configuration Debug -derivedDataPath build-test -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO test | tee test.log | grep -E "error:|Test Case|TEST" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Fake phone log
        if: always()
        run: cat fake_phone.log || true
      - name: Zip app
        run: cd mac/build/Build/Products/Release && ditto -c -k --sequesterRsrc --keepParent LinkToMac.app LinkToMac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LinkToMac-macOS
          path: mac/build/Build/Products/Release/LinkToMac.zip
