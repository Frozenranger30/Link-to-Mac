name: Android End-to-End Test
on: [push, workflow_dispatch]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build e2e APK
        working-directory: android
        run: ./gradlew --no-daemon assembleE2e
      - name: Python dependencies
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet cryptography
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PYTHON: /tmp/venv/bin/python
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/android_e2e.sh
